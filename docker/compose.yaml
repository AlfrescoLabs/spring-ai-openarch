# Hyland OpenArch engine for the integration tests. Test use only: no authentication on
# MongoDB and OpenSearch. Users come from users.yml: admin:password (administrator) and
# springai:springai (non-admin).
#
#   docker compose -f docker/compose.yaml up -d --wait
#   OPENARCH_URL=http://localhost:8080 mvn verify
#   docker compose -f docker/compose.yaml down
name: spring-ai-openarch-it

services:
  openarch-app:
    image: ghcr.io/hyland/openarch-app-jvm:${OPENARCH_VERSION:-1.0.90}
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_ADDRESSLIST: http://opensearch:9200
      NUXEO_MONGODB_SERVER: mongo:27017
      NUXEO_MONGODB_DBNAME: openarch
      NUXEO_URL: "http://localhost:${OPENARCH_PORT:-8080}"
      OPENARCH_USERS_FILE: file:/etc/openarch/users.yml
      JAVA_OPTIONS: -Daws.crt.libc=musl -Xmx1g
    volumes:
      - ./users.yml:/etc/openarch/users.yml:ro
    ports:
      - "127.0.0.1:${OPENARCH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  # Hyland OpenArch needs a MongoDB replica set, even with one node.
  mongodb:
    image: mongo:7.0.39
    hostname: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    networks:
      default:
        aliases:
          - mongo

  mongodb-init:
    image: mongo:7.0.39
    restart: "no"
    depends_on:
      - mongodb
    command:
      - /bin/sh
      - -c
      - |-
        for i in $$(seq 60); do
          mongosh --host mongo:27017 --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1 && break
          sleep 1
        done
        mongosh --host mongo:27017 --quiet --eval 'try { rs.status().ok; } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }'

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
